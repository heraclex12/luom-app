name: Request a feature
description: An idea that would make Lượm better for you.
title: "[Idea] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Lượm! You can write in English or Vietnamese (bạn có thể viết bằng tiếng Việt).
        Before posting, please check whether someone already asked for it: a 👍 on their post counts too.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Lượm to do?
      placeholder: "After a pop quiz, I'd like to…"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, examples, or apps that do something similar.
