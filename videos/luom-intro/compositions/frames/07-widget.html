    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

      <svg data-hf-id="hf-5x8g" viewBox="0 0 20 28" aria-hidden="true">
        <path data-hf-id="hf-widb" d="M2 1 L2 22 L7.5 17 L11 26 L14.5 24.5 L11 16 L18 16 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
      </svg>

    <script>
      (function () {
        var FID = "07-widget";
        var DUR = 3.5;
        var $ = function (id) { return document.getElementById(FID + "-" + id); };

        var world = $("world");
        var card = $("card");
        var eyebrow = $("eyebrow");
        var line1 = $("line1");
        var line2 = $("line2");
        var sub = $("sub");
        var sizes = $("sizes");
        var cursor = $("cursor");
        var ripple = $("ripple");

        // Camera: source px -> canvas px. Start = the whole desktop filling the frame (cover = 1920/1600).
        // Land on the large "meticulous" widget (source x 25-480, y 55-532): scale 1.7, image left edge
        // pinned to the frame edge (no void), menu bar pushed off the top -> widget at x 42-816, y 38-848.
        var CAM_START = { s: 1.2, x: 0, y: 0 };
        var CAM_END = { s: 1.7, x: 0, y: -56 };
        var cam = { s: CAM_START.s, x: CAM_START.x, y: CAM_START.y };
        var drift = { p: 0 };
        var DRIFT_AMP_X = 3, DRIFT_AMP_Y = 1.5, DRIFT_RATIO = 1.3;

        function applyCamera() {
          // x: one smooth leftward breath (never exposes the pinned left edge); y: sine at ~1.3x
          var dx = -DRIFT_AMP_X * (1 - Math.cos(drift.p)) / 2;
          var dy = Math.sin(drift.p * DRIFT_RATIO) * DRIFT_AMP_Y;
          var tx = cam.x + dx;
          world.style.transform = "translate(" + tx + "px," + (cam.y + dy) + "px) scale(" + cam.s + ")";
        }

        // "Show meaning" button: source x 45-460, y 252-286 -> click point source (270, 269)
        var CLICK_X = CAM_END.x + 270 * CAM_END.s; // ~459
        var CLICK_Y = CAM_END.y + 269 * CAM_END.s; // ~401
        var HOT_X = 2.6, HOT_Y = 1.3; // path tip (2,1) at 26/20 scale

        gsap.set(ripple, { left: CLICK_X - 32, top: CLICK_Y - 32, scale: 0, opacity: 0 });
        gsap.set(cursor, { x: 0, y: 0 });

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.6s): one smooth push from the full desktop to the large widget, then still.
        tl.fromTo(cam, { s: CAM_START.s, x: CAM_START.x, y: CAM_START.y },
          { s: CAM_END.s, x: CAM_END.x, y: CAM_END.y, duration: 1.6, ease: "power3.out", onUpdate: applyCamera }, 0);
        // micro-drift under everything (the single writer composes both channels)
        tl.fromTo(drift, { p: 0 }, { p: Math.PI * 2, duration: DUR, ease: "none", onUpdate: applyCamera }, 0);

        // Scene 2 (1.2-2.2s): the card arrives with eyebrow + headline; cursor clicks "Show meaning".
        tl.fromTo(card, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.2);
        tl.fromTo(eyebrow, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);
        tl.fromTo(line1, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.38);
        tl.fromTo(line2, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.48);

        // cursor glides in on a gentle arc (x and y on different eases) to the button
        var START_X = 760, START_Y = 800;
        tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 1.2);
        tl.fromTo(cursor, { x: START_X - HOT_X }, { x: CLICK_X - HOT_X, duration: 0.55, ease: "power2.inOut" }, 1.2);
        tl.fromTo(cursor, { y: START_Y - HOT_Y }, { y: CLICK_Y - HOT_Y, duration: 0.55, ease: "sine.inOut" }, 1.2);
        // click: 0.12s press + one ring ripple
        tl.fromTo(cursor, { scale: 0.9 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 1.8);
        tl.fromTo(ripple, { scale: 0, opacity: 0.6 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 1.8);

        // Scene 3 (2.2-3.5s): sub line and the sizes pill, then a held read.
        tl.fromTo(sub, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.2);
        tl.fromTo(sizes, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.4);

        tl.set({}, {}, DUR);

        applyCamera();
        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
