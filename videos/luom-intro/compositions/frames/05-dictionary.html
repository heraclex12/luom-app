  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "05-dictionary";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var tl = gsap.timeline({ paused: true });
      var DUR = 4;

      // ---------- Geometry (screenshot source px -> frame px) ----------
      var K = 0.57;                       // 1641.6 / 2880
      var IMG_X = -426.8;                 // image-layer offset inside the viewport
      var SHOT_X = 729.6, SHOT_Y = 96 + 36.5; // viewport origin in frame px (window + title bar)
      var VW = 1094.4, VH = 808.3;
      var CX = VW / 2, CY = VH / 2;
      // coordinate-target-zoom: target = headword area (src x 1000-2350 / y 120-1000, centred on the search box)
      var ZOOM = 1.45;
      var TGT = { x: 1664 * K + IMG_X, y: 540 * K };
      var TX = CX - TGT.x, TY = CY - TGT.y;   // nested-wrapper formula: T = -offset
      function toFrame(sx, sy) {               // where a source pixel lands at the end of the zoom
        var lx = sx * K + IMG_X, ly = sy * K;
        return { x: SHOT_X + CX + ZOOM * (lx - TGT.x), y: SHOT_Y + CY + ZOOM * (ly - TGT.y) };
      }
      var P_START = { x: 1560, y: 770 };
      var P_CHIP = toFrame(1112, 436);         // US speaker icon
      var P_AI = toFrame(1835, 326);           // resting on Improve with AI

      // ---------- Scene 1 (0.0-1.4): copy + window + typing ----------
      tl.fromTo($("eyebrow"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.0);
      tl.fromTo($("h1"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.12);
      tl.fromTo($("h2"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.24);
      tl.fromTo($("win"), { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 0.08);

      // discrete-text-sequence: "resilient" typed letter by letter into the covered search field.
      // Each state is a property set on the timeline (no callbacks), so any seek lands on the right state.
      var KEYS = [0.50, 0.58, 0.67, 0.74, 0.83, 0.90, 1.00, 1.08, 1.17];
      KEYS.forEach(function (t, i) {
        tl.fromTo($("ch" + i), { display: "none" }, { display: "inline", duration: 0, immediateRender: false }, t);
      });
      // caret: appears at 0.35, solid while typing, then a 0.6s on/off blink to the end
      var caretEl = $("caret");
      tl.fromTo(caretEl, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 0.35);
      for (var bt = 1.3, on = false; bt < DUR; bt += 0.3, on = !on) {
        tl.set(caretEl, { opacity: on ? 1 : 0 }, bt);
      }

      // Cursor: hotspot = path tip (2.6, 1.3 in rendered px). Gentle arcs: x and y share timing but not ease.
      var cursorEl = $("cursor");
      function hx(p) { return p.x - 2.6; }
      function hy(p) { return p.y - 1.3; }
      gsap.set(cursorEl, { x: hx(P_START), y: hy(P_START) });
      tl.fromTo(cursorEl, { x: hx(P_START) }, { x: hx(P_CHIP), duration: 0.85, ease: "power2.inOut", immediateRender: false }, 1.5);
      tl.fromTo(cursorEl, { y: hy(P_START) }, { y: hy(P_CHIP), duration: 0.85, ease: "power3.inOut", immediateRender: false }, 1.5);
      tl.fromTo(cursorEl, { x: hx(P_CHIP) }, { x: hx(P_AI), duration: 0.55, ease: "power2.inOut", immediateRender: false }, 2.75);
      tl.fromTo(cursorEl, { y: hy(P_CHIP) }, { y: hy(P_AI), duration: 0.55, ease: "power1.inOut", immediateRender: false }, 2.75);

      // ---------- Scene 2 (1.4-2.6): zoom into the headword, click the US speaker ----------
      tl.fromTo($("zoom-outer"), { scale: 1 }, { scale: ZOOM, duration: 1.0, ease: "power3.inOut" }, 1.4);
      tl.fromTo($("zoom-inner"), { x: 0, y: 0 }, { x: TX, y: TY, duration: 1.0, ease: "power3.inOut" }, 1.4);

      tl.fromTo(cursorEl, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.42);
      // click: 0.12s press + one ring ripple at the hotspot
      tl.fromTo(cursorEl, { scale: 1 }, { scale: 0.9, duration: 0.06, ease: "power2.in" }, 2.38);
      tl.to(cursorEl, { scale: 1, duration: 0.06, ease: "power2.out" }, 2.44);
      tl.fromTo($("ripple"),
        { x: P_CHIP.x - 32, y: P_CHIP.y - 32, scale: 0, opacity: 0.6 },
        { x: P_CHIP.x - 32, y: P_CHIP.y - 32, scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, 2.4);
      // three sound rings radiate from the chip
      ["sound-1", "sound-2", "sound-3"].forEach(function (id, i) {
        tl.fromTo($(id), { scale: 0.3, opacity: 0 }, { scale: 0.3, opacity: 0.7, duration: 0.01 }, 2.44 + i * 0.14);
        tl.to($(id), { scale: 1, opacity: 0, duration: 0.62, ease: "power2.out" }, 2.45 + i * 0.14);
      });

      // ---------- Scene 3 (2.6-4.0): glide to Improve with AI, outline settles, sub reveals ----------
      tl.fromTo($("s1"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.7);
      tl.fromTo($("s2"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.05);
      tl.fromTo($("outline"), { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 3.28);

      // Initial states for elements revealed later (fromTo also enforces them on seek)
      gsap.set([$("sound-1"), $("sound-2"), $("sound-3"), $("outline"), $("ripple")], { opacity: 0 });
      gsap.set(cursorEl, { opacity: 0 });
      gsap.set([$("s1"), $("s2")], { opacity: 0 });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
