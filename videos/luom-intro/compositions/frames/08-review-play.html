      var CLICK_X = 233, CLICK_Y = 684;           // option 1 on the study card

      // ── Scene 1 (0.0–0.7): eyebrow, headline line 1, study card rises, rail dot 4 fills

      tl.fromTo($("dotfill"), { scale: 0 }, { scale: 1, duration: 0.45, ease: "power3.out" }, 0.3);

      // ── Scene 2 (0.7–1.8): cursor arcs to option 1, clicks, card turns to the answered state, "Rated Good" pops

      tl.fromTo($("cursor"), { x: 560 - HOT_X }, { x: CLICK_X - HOT_X, duration: 0.6, ease: "power2.inOut" }, 0.45);

      tl.to($("cursor"), { scale: 1, duration: 0.06, ease: "power1.out" }, 1.11);
      tl.fromTo($("ring"), { scale: 0, opacity: 0.6 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, 1.05);
