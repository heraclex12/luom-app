    <script>
      (function () {
        var byId = function (id) { return document.getElementById(id); };
        var chip = byId("02-intro-chip");
        var chipLabel = byId("02-intro-chip-label");
        var icon = byId("02-intro-icon");
        var wordmark = byId("02-intro-wordmark");
        var tag1 = byId("02-intro-tag1");
        var tag2 = byId("02-intro-tag2");
        var brush = byId("02-intro-brush").querySelector("path");
        var hand = byId("02-intro-hand");

        var tl = gsap.timeline({ paused: true });

        // Icon centre (676, 442) relative to the chip centre (960, 760): the mark blooms out of the chip.
        var DX = 960 - 676;
        var DY = 760 - 442;

        // Scene 1 (0.0–0.9s): the chip shrinks to a dot; the icon blooms out of it and settles at left-centre.
        tl.fromTo(chip,
          { xPercent: -50, yPercent: -50, scaleX: 1, scaleY: 1 },
          { xPercent: -50, yPercent: -50, scaleX: 0.26, scaleY: 0.82, duration: 0.22, ease: "power2.in" }, 0);
        tl.fromTo(chipLabel, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.out" }, 0);
        tl.fromTo(chip, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.in", immediateRender: false }, 0.17);

        tl.fromTo(icon, { x: DX }, { x: 0, duration: 0.72, ease: "power3.out" }, 0.18);
        tl.fromTo(icon, { y: DY }, { y: 0, duration: 0.72, ease: "power2.out" }, 0.18);
        tl.fromTo(icon, { scale: 0.06 }, { scale: 1, duration: 0.72, ease: "power3.out" }, 0.18);
        tl.fromTo(icon, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 0.18);

        // Scene 2 (0.9–1.8s): wordmark slides in from the right beside the icon.
        tl.fromTo(wordmark,
          { x: 150, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.9);

        // Scene 3 (1.8–2.8s): tagline line by line, brush underline draws, hand-lettered note pops.
        tl.fromTo(tag1,
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.8);
        tl.fromTo(tag2,
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.02);
        tl.fromTo(brush,
          { strokeDashoffset: 100 },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.28);
        tl.fromTo(hand,
          { scale: 0, rotation: -3, opacity: 0 },
          { scale: 1, rotation: -3, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.42);

        // Scene 4 (2.8–3.5s): held lockup.

        window.__timelines = window.__timelines || {};
        window.__timelines["02-intro"] = tl;
