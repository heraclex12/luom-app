    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById("12-garden-" + id);
        const GREEN = "#2F8A63";
        const tl = gsap.timeline({ paused: true });

        const el = {
          bg: $("bg"), eyebrow: $("eyebrow"), hl1: $("hl1"), hl2: $("hl2"), headline: $("headline"),
          plant: $("chip-plant"), water: $("chip-water"), bloom: $("chip-bloom"),
          sub1: $("sub1"), sub2: $("sub2"),
          wrap: $("stagewrap"), stage: $("stage"), old: $("old"),
          seed: $("l-seed"), seedZo: $("seed-zo"), seedZi: $("seed-zi"),
          thirsty: $("l-thirsty"), wgroup: $("l-water"), w1: $("w1"), w2: $("w2"), w3: $("w3"),
          answer: $("answer"), bloomL: $("l-bloom"),
          levels: $("levels"), world: $("world"),
          pill: $("pill"), num: $("num"), hlB: $("headline-b"),
          railGrow: $("rail-grow"), dotGrow: $("dot-grow"),
        };
        const chips = [el.plant, el.water, el.bloom];

        // ---------- initial states (seek-safe: everything set at build time) ----------
        gsap.set([el.thirsty, el.wgroup, el.bloomL, el.w2, el.w3, el.answer], { opacity: 0 });
        gsap.set([el.sub1, el.sub2], { opacity: 0 });
        gsap.set(el.levels, { opacity: 0 });
        gsap.set(el.world, { scale: 1.5 });
        gsap.set([25, 50, 70, 90, 100, 140].map((lv) => $("lv" + lv)), { opacity: 0 });
        gsap.set([el.pill, el.hlB], { opacity: 0 });

        // ---------- Scene 1 (0.0–1.4): Plant ----------
        tl.fromTo(el.eyebrow, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.0);
        tl.fromTo(el.hl1, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.08);
        tl.fromTo(el.hl2, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.18);
        tl.fromTo(chips, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 }, 0.4);
        tl.fromTo(el.wrap, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.04);
        // rail: the Grow dot fills
        tl.fromTo(el.dotGrow, { backgroundColor: "#E6E6EA" }, { backgroundColor: GREEN, duration: 0.4, ease: "power2.out" }, 0.35);
        tl.fromTo(el.railGrow, { color: "#6E6E73" }, { color: GREEN, duration: 0.4, ease: "power2.out" }, 0.35);
        // coordinate-target-zoom onto the "resilient · Seed: not learned yet" tooltip: the crop keeps the tooltip
        // high in the garden card, so the zoom is anchored on it (origin = tooltip centre) instead of centring it,
        // which would pull the app chrome above the garden into view
        tl.fromTo(el.seedZo, { scale: 1 }, { scale: 1.15, duration: 1.1, ease: "power3.inOut" }, 0.15);

        // cut-the-curve helper (leftward, velocity-matched power4.in / power4.out)
        function cutCurve(outEl, inEl, T) {
          tl.to(outEl, { x: -230, duration: 0.3, ease: "power4.in" }, T - 0.3);
          tl.to(outEl, { opacity: 0, duration: 0.22, ease: "power1.in" }, T - 0.22);
          tl.fromTo(inEl, { x: 230, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, T);
        }
        function lightChip(prev, next, T) {
          tl.fromTo(prev, { backgroundColor: GREEN, color: "#FFFFFF" }, { backgroundColor: "rgba(47,138,99,0.12)", color: GREEN, duration: 0.25, ease: "power2.out", immediateRender: false }, T);
          tl.fromTo(next, { backgroundColor: "#FFFFFF", color: "#6E6E73" }, { backgroundColor: GREEN, color: "#FFFFFF", duration: 0.25, ease: "power2.out", immediateRender: false }, T);
        }

        // ---------- Scene 2 (1.4–2.2): Needs water ----------
        cutCurve(el.seed, el.thirsty, 1.4);
        lightChip(el.plant, el.water, 1.4);
        tl.fromTo(el.sub1, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, 1.45);

        // ---------- Scene 3 (2.2–3.1): droplets fall in Garden rescue ----------
        cutCurve(el.thirsty, el.wgroup, 2.2);
        tl.fromTo(el.answer, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 2.32);
        tl.fromTo(el.w2, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, 2.5);
        tl.fromTo(el.w3, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, 2.8);

        // ---------- Scene 4 (3.1–4.1): In bloom ----------
        cutCurve(el.wgroup, el.bloomL, 3.1);
        lightChip(el.water, el.bloom, 3.1);
        tl.fromTo(el.sub2, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, 3.15);

        // ---------- Scene 5 (4.1–6.5): the garden becomes a world ----------
        // left column fades; headline hard-cuts to the centred line
        tl.to([el.eyebrow, el.plant.parentNode, el.sub1.parentNode], { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.05);
        tl.to(el.headline, { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.1);
        // the centred line lands once the morphing card has cleared its band
        tl.fromTo(el.hlB, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, 4.48);
        // page turns white so the grey stage reads as a card
        tl.to(el.bg, { backgroundColor: "#FFFFFF", duration: 0.8, ease: "power2.inOut" }, 4.1);

        // card-morph-anchor: one tween for shape + surface (clip-path stands in for size so the aspect can change)
        const MORPH_AT = 4.1, MORPH_DUR = 0.65;
        tl.to(el.stage, { clipPath: "inset(132px 144px 76px 0px round 24px)", backgroundColor: "#F5F5F7", duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_AT);
        tl.to(el.old, { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" }, MORPH_AT);
        tl.fromTo(el.levels, { opacity: 0 }, { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false }, MORPH_AT + MORPH_DUR * 0.6);

        // ONE continuous decelerating zoom-out under the level crossfades; locks at 6.0
        tl.fromTo(el.world, { scale: 1.5 }, { scale: 1, duration: 1.55, ease: "power2.out", immediateRender: false }, 4.45);

        // levels crossfade, accelerating (1 → 25 → 50 → 70 → 90 → 100 → 140)
        const KEYS = [[4.6, 1], [5.0, 25], [5.3, 50], [5.55, 70], [5.75, 90], [5.9, 100], [6.02, 140]];
        KEYS.slice(1).forEach(([t, lv]) => {
          tl.fromTo($("lv" + lv), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.inOut", immediateRender: false }, t - 0.08);
        });

        // Level pill: counting-dynamic-scale, value tracks the level on screen
        tl.fromTo(el.pill, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 4.55);
        const C0 = KEYS[0][0], C1 = KEYS[KEYS.length - 1][0];
        // value tracks the level on screen: one linear innerText segment per crossfade (snap to integers)
        for (let i = 1; i < KEYS.length; i++) {
          const [ta, va] = KEYS[i - 1], [tb, vb] = KEYS[i];
          tl.fromTo(el.num, { innerText: va }, { innerText: vb, snap: { innerText: 1 }, duration: tb - ta, ease: "none", immediateRender: false }, ta);
        }
        tl.fromTo(el.num, { scale: 0.7 }, { scale: 1, duration: C1 - C0, ease: "power3.out", immediateRender: false }, C0);
        // 6.02–6.5: held read (no camera after the lock); pad the timeline to the full frame length
        tl.set({}, {}, 6.5);

        window.__timelines = window.__timelines || {};
