      // Orthogonal leader: from (x,y) right to bus, vertical to ty, right to tx; rounded corners.
      function elbow(x, y, bus, ty, tx) {
        var c = 14, up = ty < y ? -1 : 1;
        return "M" + f(x) + " " + f(y) + " L" + f(bus - c) + " " + f(y) +
          " Q" + f(bus) + " " + f(y) + " " + f(bus) + " " + f(y + up * c) +
          " L" + f(bus) + " " + f(ty - up * c) +
          " Q" + f(bus) + " " + f(ty) + " " + f(bus + c) + " " + f(ty) +
          " L" + f(tx) + " " + f(ty);
      }
      // Rounded box drawn as two halves from its left-middle (upper / lower), meeting at the right-middle.
      function boxFromLeft(b) {
        var ym = (b.y0 + b.y1) / 2, r = b.r;
        var A = function (x, y, sweep) { return " A" + f(r) + " " + f(r) + " 0 0 " + sweep + " " + f(x) + " " + f(y); };
        return [

      function pillFromTop(b) {
        var xm = (b.x0 + b.x1) / 2, r = b.r;
        var A = function (x, y, sweep) { return " A" + f(r) + " " + f(r) + " 0 0 " + sweep + " " + f(x) + " " + f(y); };
        return [

      // Saved: up the gap, across the white strip under the popup header, then down onto the Saved pill.
      var c4 = 9;
      $("lead-4").setAttribute("d",

      // Examples box halves start from the leader's landing y (inside the box's left edge).

        return [

      tl.fromTo($("step-2"), { color: "#6E6E73" }, { color: "#2F8A63", duration: 0.45, ease: "power3.out" }, 0.3);

      // ── Scene 2 (0.6–2.6s): callouts tick in 0.45s apart; each leader draws to its part, box draws round it ──
      var LEAD_DUR = [0.4, 0.42, 0.34, 0.5];
      var T0 = 0.65, STEP = 0.45;
      for (var i = 0; i < 4; i++) {
        var n = i + 1, t = T0 + i * STEP;
        tl.fromTo($("callout-" + n), { x: -22, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
        tl.fromTo($("tick-" + n), { strokeDashoffset: OFF }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, t + 0.14);
        var lt = t + 0.12;
        tl.fromTo($("lead-" + n), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, lt);
        tl.fromTo($("lead-" + n), { strokeDashoffset: OFF }, { strokeDashoffset: 0, duration: LEAD_DUR[i], ease: "power2.out" }, lt);
        var bt = lt + LEAD_DUR[i] * 0.8;
        ["a", "b"].forEach(function (h) {
          tl.fromTo($("box-" + n + h), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, bt);
          tl.fromTo($("box-" + n + h), { strokeDashoffset: OFF }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, bt);
        });
        // The previous leader steps back so the newest one leads the eye (boxes stay).
        if (i > 0) {
          tl.fromTo($("lead-" + i), { opacity: 1 }, { opacity: 0.3, duration: 0.3, ease: "power1.out", immediateRender: false }, t + 0.1);
        }
      }
      // US speaker emits three sound rings as its box lands.
      var RING_T = T0 + STEP + 0.12 + LEAD_DUR[1] * 0.8;
      ["ring-1", "ring-2", "ring-3"].forEach(function (id, k) {
        var rt = RING_T + k * 0.14;
        tl.fromTo($(id), { opacity: 0 }, { opacity: 0.75, duration: 0.01, ease: "none" }, rt);
        tl.fromTo($(id), { scale: 0.45, opacity: 0.75 }, { scale: 1.6, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, rt + 0.01);
      });

      // ── Scene 3 (2.6–3.5s): sub line reveals; Saved pill gives one soft pulse; hold ──
      tl.fromTo($("sub"), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.6);
      tl.fromTo($("lead-4"), { opacity: 1 }, { opacity: 0.55, duration: 0.4, ease: "power1.out", immediateRender: false }, 2.85);
      tl.fromTo(pulse, { opacity: 0 }, { opacity: 0.6, duration: 0.01, ease: "none" }, 2.8);
      tl.fromTo(pulse, { scale: 1, opacity: 0.6 }, { scale: 1.25, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 2.81);

      tl.set({}, {}, 3.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-meaning"] = tl;
    })();
  </script>
