# Packaging (after `electron-vite build` writes out/). macOS only.
# Icons: build/icon.icns is picked up automatically (directories.buildResources).
appId: com.envilearn.app
# Bundle / executable / CFBundleName stay ASCII ("Luom.app"): Electron finds its helper apps through CFBundleName and
# aborts ("Unable to find helper app") with Vietnamese letters there. The shown name "Lượm" is the localized
# display name (scripts/after-pack.cjs; mac.extendInfo turns it on). appId and the data folder (package.json name "envi-learn") are unchanged so
# saved words and macOS permissions carry over from the EnVi Learn builds.
productName: Luom
afterPack: scripts/after-pack.cjs
# ASCII installer file name.
artifactName: Luom-${version}-${arch}.${ext}
# Use the Electron already installed in node_modules (no download, matches the dev/test runtime).
electronDist: node_modules/electron/dist

directories:
  buildResources: build
  # dist/ is used by the design-system build; installers go to release/.
  output: release

# Only build output + package.json; production dependencies are added automatically.
# Renderer-only packages live in devDependencies (vite bundles them), so they stay out of the app.
files:
  - out/**
  - package.json

extraResources:
  # Drizzle migrations are read from disk at runtime (src/main/db.ts migrationsFolder()).
  - from: drizzle
    to: drizzle
  # Menu bar icon (src/main/menubar.ts resourcePath()).
  - from: resources
    to: resources

# better-sqlite3's .node can't be dlopen'ed from inside asar.
asarUnpack:
  - '**/*.node'

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: dir
      arch: [arm64]
  category: public.app-category.education
  # Personal build: ad-hoc signed (no Apple Developer ID); see README for first-launch steps.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    # Must equal the bundle file name (Luom.app) for macOS to use the localized name; the localized value "Lượm" is
    # written to <lang>.lproj/InfoPlist.strings by scripts/after-pack.cjs.
    CFBundleDisplayName: Luom
    LSHasLocalizedDisplayName: true
    NSAppleEventsUsageDescription: Lượm sends ⌘C to the frontmost app to read the word you selected when you press the capture hotkey.
    LSUIElement: false
